name: hybrid-school
x-app: &app
  build:
    context: .
    target: server
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_PROVIDER: postgresql
    CACHE_BACKEND: redis
    DATABASE_URL: postgresql://${POSTGRES_USER:-school}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-school}?schema=public&connection_limit=20&pool_timeout=10
    REDIS_URL: redis://redis:6379
    PORT: 3000
    TRUST_PROXY: 1
    UPLOAD_DIR: /app/data/uploads
  volumes: [uploads_data:/app/data/uploads]
  restart: unless-stopped
  init: true
  networks: [school]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-school}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [school]
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, 256mb, --maxmemory-policy, volatile-lru]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [school]
  migrate:
    <<: *app
    restart: 'no'
    command: [npm, run, db:migrate]
    depends_on:
      db: { condition: service_healthy }
  seed:
    <<: *app
    restart: 'no'
    command: [npm, run, db:seed]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  api:
    <<: *app
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: [npm, run, worker, -w, backend]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      target: web
    ports: ['${WEB_PORT:-8080}:8080']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [school]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  redis_data:
  uploads_data:
networks:
  school:
    driver: bridge
